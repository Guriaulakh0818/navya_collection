name: Testing CI Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    name: Run Unit, Integration & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: Execute Vitest Unit & Integration Suite
        run: npx vitest run --coverage

      - name: Build Application for Playwright E2E
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/test'
          JWT_SECRET: 'ci-testing-secret-key-32-characters-minimum!'
          NEXTAUTH_SECRET: 'ci-testing-secret-key-32-characters-minimum!'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite
        run: npx playwright test --project="Mobile Chrome (375px)"
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/test'
          JWT_SECRET: 'ci-testing-secret-key-32-characters-minimum!'
          NEXTAUTH_SECRET: 'ci-testing-secret-key-32-characters-minimum!'
