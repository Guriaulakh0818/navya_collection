name: Testing CI Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    name: Run Unit, Integration & Build Verification
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test?sslmode=disable'
      DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/test?sslmode=disable'
      DATABASE_ENV: 'test'
      JWT_SECRET: 'ci-testing-secret-key-32-characters-minimum!'
      NEXTAUTH_SECRET: 'ci-testing-secret-key-32-characters-minimum!'
      SKIP_PROD_ENV_VALIDATION: '1'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: Execute Vitest Unit & Integration Suite
        run: npm test

      - name: Build Application Verification
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PHASE: phase-production-build

